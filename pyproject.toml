[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dqp"
version = "0.2.0"
description = "Multi-platform data connection, normalization, validation and coverage platform"
requires-python = ">=3.10"
dependencies = ["pandas>=2.1", "openpyxl>=3.1", "httpx>=0.27", "rapidfuzz>=3.0", "streamlit>=1.36"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dqp = "dqp.cli:main"

[tool.setuptools.packages.find]
include = ["dqp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
